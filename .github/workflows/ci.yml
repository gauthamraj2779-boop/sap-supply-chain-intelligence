name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # No credentials are provided on purpose: the suite must pass without a
      # database or an LLM key, which is the system's core guarantee.
      - run: python -m pytest tests/ -q
      - name: Smoke test against a live server
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 40); do curl -sf localhost:8000/api/health && break; sleep 1; done
          python scripts/smoke_test.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
