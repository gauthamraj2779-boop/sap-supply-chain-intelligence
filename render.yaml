# One-click deploy: https://render.com/deploy
#
# A single service serves both the API and the console — one URL, no CORS, and
# no ordering dependency between the two. It runs with no credentials: the
# in-process graph and the deterministic engines produce the full financial
# report on their own. Neo4j and an LLM key are optional upgrades set here.
services:
  - type: web
    name: sap-supply-chain-intelligence
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .          # repo root, so the image can build the frontend too
    healthCheckPath: /api/health
    envVars:
      - key: GRAPH_BACKEND
        value: memory
      # Optional, all settable in the dashboard without a code change:
      # LLM_PROVIDER, AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY,
      # AZURE_OPENAI_DEPLOYMENT, NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD
